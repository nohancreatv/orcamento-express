name: Firebase isolation tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  firestore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: node tests/firebase.test.mjs
      - run: npx firebase emulators:exec --only firestore --project demo-orcamento-express 'node tests/firebase-rules.test.mjs'
